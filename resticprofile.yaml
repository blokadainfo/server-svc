# yaml-language-server: $schema=https://creativeprojects.github.io/resticprofile/jsonschema/config.json

version: "1"

global:
  scheduler: crond
  initialize: true

lldap:
  repository: "s3:https://{{ .Env.LLDAP_S3_ENDPOINT }}/{{ .Env.LLDAP_S3_BUCKET }}"
  env:
    RESTIC_PASSWORD: "{{ .Env.LLDAP_ENCRYPTION_KEY }}"
    AWS_ACCESS_KEY_ID: "{{ .Env.LLDAP_S3_ACCESS_KEY_ID }}"
    AWS_SECRET_ACCESS_KEY: "{{ .Env.LLDAP_S3_SECRET_ACCESS_KEY }}"
  backup:
    source:
      - "/data/backup/lldap"
    schedule: "hourly"
    schedule-permission: "system"
    check-before: true
  retention:
    before-backup: false
    after-backup: true
    keep-last: 10
    keep-hourly: 72
    keep-daily: 14
    keep-weekly: 4
    keep-monthly: 6
    keep-yearly: 1
    prune: true

