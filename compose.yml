    internal: false
  authelia-2-internet:
    internal: false
  authelia-2-valkey:
    internal: true
  authelia-2-postgres:
    internal: true
  authelia-2-lldap:
    internal: true
  authelia-pgdumper-2-postgres:
    internal: true
  authelia-restic-2-internet:
    internal: false
  umami-2-internet:
    internal: false
  umami-2-postgres:
    internal: true
  umami-pgdumper-2-postgres:
    internal: true
  umami-restic-2-internet:
    internal: false
  umami-2-valkey:
    internal: true
  vaultwarden-2-internet:
    internal: false
  vaultwarden-2-postgres:
    internal: true
  vaultwarden-pgdumper-2-postgres:
    internal: true
  vaultwarden-restic-2-internet:
    internal: false
  sftpgo-2-internet:
    internal: false
  sftpgo-2-postgres:
    internal: true
  sftpgo-pgdumper-2-postgres:
    internal: true
  sftpgo-restic-2-internet:
    internal: false
