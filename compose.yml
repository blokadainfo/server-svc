services:
  # Reverse proxy
  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:v1.6.11
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"
      CUSTOM_HOSTNAME: "crowdsec"
      BOUNCER_KEY_TRAEFIK: ${BOUNCER_KEY_TRAEFIK}
    volumes:
      - type: volume
        source: traefik-logs-vol
        target: /var/log/traefik
        volume:
          nocopy: false
      - type: volume
        source: crowdsec-db-vol
        target: /var/lib/crowdsec/data
        volume:
          nocopy: false
      - type: volume
        source: crowdsec-conf-vol
        target: /etc/crowdsec
        volume:
          nocopy: false
      - type: bind
        source: ./acquis.yaml
        target: /etc/crowdsec/acquis.yaml
        read_only: true
    networks:
      - internal
    restart: unless-stopped

  traefik:
    depends_on:
      - crowdsec
    image: docker.io/library/traefik:v3.5.3
    command:
      - "--accesslog"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http3"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--experimental.plugins.bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.bouncer.version=v1.4.5"
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - type: volume
        source: traefik-logs-vol
        target: /var/log/traefik
        volume:
          nocopy: false
      - type: volume
        source: traefik-acme-vol
        target: /acme
        volume:
          nocopy: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    networks:
      - internal
    restart: unless-stopped

  # Analytics
  umami-postgres:
    image: docker.io/library/postgres:16.9
    environment:
      POSTGRES_DB: ${UMAMI_DATABASE_DB:-um}
      POSTGRES_USER: ${UMAMI_DATABASE_USER:-um}
      POSTGRES_PASSWORD: ${UMAMI_DATABASE_PASSWORD}
    volumes:
      - type: volume
        source: umami-postgres-vol
        target: /var/lib/postgresql/data
        volume:
          nocopy: false
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${UMAMI_DATABASE_USER:-um} -d ${UMAMI_DATABASE_DB:-um}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  umami-pgdumper:
    image: docker.io/martlark/pg_dump:16.1
    environment:
      CRON_SCHEDULE: "1 * * * *"
      RETAIN_COUNT: 1
      PGHOST: "umami-postgres"
      POSTGRES_DB: ${UMAMI_DATABASE_DB:-um}
      PGUSER: ${UMAMI_DATABASE_USER:-um}
      POSTGRES_PASSWORD: ${UMAMI_DATABASE_PASSWORD}
    volumes:
      - type: bind
        source: /var/stor/umami/pgdump
        target: /dump
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      umami-postgres:
        condition: service_healthy
        restart: true

  umami-restic:
    image: ghcr.io/lobaro/restic-backup-docker:v1.4.2
    environment:
      BACKUP_CRON: "52 * * * *" # Every hour at 52nd minute
      RESTIC_FORGET_ARGS: "--prune --keep-last 3 --keep-hourly 12 --keep-daily 7 --keep-weekly 4 --keep-monthly 3"
      RESTIC_PASSWORD: "${UMAMI_RESTIC_ENCRYPTION_KEY}"
      RESTIC_REPOSITORY: "s3:https://${UMAMI_RESTIC_S3_ENDPOINT}/${UMAMI_RESTIC_S3_BUCKET}"
      AWS_ACCESS_KEY_ID: "${UMAMI_RESTIC_S3_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${UMAMI_RESTIC_S3_SECRET_ACCESS_KEY}"
    volumes:
      - type: bind
        source: /var/stor/umami
        target: /data/backup
        read_only: true
    networks:
      - internal
    restart: unless-stopped

  umami-valkey:
    image: docker.io/valkey/valkey:8.1.5
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${UMAMI_CACHE_PASSWORD}"
    volumes:
      - type: volume
        source: umami-valkey-vol
        target: /data
        volume:
          nocopy: false
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "valkey-cli"
        - "-a"
        - "${UMAMI_CACHE_PASSWORD}"
        - "ping"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  umami:
    init: true # https://github.com/krallin/tini#using-tini
    image: ghcr.io/umami-software/umami:3.0.3
    environment:
      DATABASE_URL: postgresql://${UMAMI_DATABASE_USER:-um}:${UMAMI_DATABASE_PASSWORD}@umami-postgres:5432/${UMAMI_DATABASE_DB:-um}
      REDIS_URL: redis://:${UMAMI_CACHE_PASSWORD}@umami-valkey:6379
      APP_SECRET: ${UMAMI_APP_SECRET}
      # DISABLE_LOGIN: 1 # CURRENTLY NOT WORKING AS BUG IN SOFTWARE, Requires proper Authelia middleware setup
      DISABLE_UPDATES: 1
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami.rule=Host(`${UMAMI_DOMAIN}`)"
      - "traefik.http.routers.umami.middlewares=crowdsec@docker,authelia@docker"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls=true"
      - "traefik.http.routers.umami.tls.certresolver=letsencrypt"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.crowdsec.plugin.bouncer.enabled=true"
      - "traefik.http.middlewares.crowdsec.plugin.bouncer.crowdsecmode=stream"
      - "traefik.http.middlewares.crowdsec.plugin.bouncer.crowdseclapikey=${BOUNCER_KEY_TRAEFIK}"
      - "traefik.http.middlewares.crowdsec.plugin.bouncer.crowdsecappsecenabled=true"
      - "traefik.http.middlewares.authelia.forwardAuth.address=https://${AUTHELIA_DOMAIN}/api/authz/forward-auth"
      - "traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Email,Remote-Name"
    restart: unless-stopped
    depends_on:
      umami-postgres:
        condition: service_healthy
        restart: true
      umami-valkey:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5

